[package]
name = "whatsapp-cleaner"
version = "0.1.0"
edition = "2024"
description = "Find and delete WhatsApp business chats from a desktop app"
readme = "README.md"
repository = "https://github.com/tnmyk/whatsapp-cleaner"
keywords = ["whatsapp", "gpui", "desktop", "cleanup"]
categories = ["gui", "command-line-utilities"]

[dependencies]
gpui = { package = "gpui-pre", version = "0.3.13" }
gpui_platform = { package = "gpui-pre-platform", version = "0.3.13", features = ["font-kit"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
qrcode = { version = "0.15", default-features = false, features = ["std"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time"] }
unicode-segmentation = "1.13.3"
ureq = "3"
whatsapp-rust = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "1b06a35eaab5e6b29ada7fc9a3030076d7b8cfba", default-features = false, features = ["sqlite-storage", "tokio-transport", "tokio-runtime", "tokio-native", "ureq-client"] }
